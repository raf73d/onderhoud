<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="js/check.js" type="module"></script>
    <link rel="icon" href="images/hamer.ico">
    <link rel="stylesheet" href="css/bootstrap.css">
    <title>Check</title>
</head>
<body>
<div class="container-lg bg-light-subtle">
    <div class="row">
        <div class="col-6">
            <h1>Check</h1>

        </div>

    </div>
    <div class="row">
        <div class="col">
            <ul class="nav">
                <li class="nav-item bg-dark-subtle">
                    <a class="nav-link" href="index.html">Thuis</a>
                </li>

            </ul>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-2">
            <label>datum:
                <input id="datum" autocomplete="off"
                       autofocus required type="date">
            </label>
        </div>
        <div class="col-2">
            <button class="btn-outline-dark rounded-2" id="datumKnop">zoek taken</button>
        </div>
        <div class="col-3">
            <span id="datumFout" class="bg-danger-subtle text-white p-2 rounded" hidden>datum nok</span>
        </div>
        <div class="col-5"></div>
    </div>
    <div class="row">
        <div class="col-12">
            <table class="table table-striped">
                <thead id="hoofd1" hidden>
                <tr>
                    <th>id</th>
                    <th>onderhoudsDatum</th>
                    <th>teller</th>
                    <th>omschrijving</th>
                    <th>machineId</th>
                    <th>status</th>
                    <th>lastPerson</th>
                </tr>
                </thead>
                <tbody id="takenBody"></tbody>
            </table>
        </div>
    </div>
    <div class="row">
        <div class="col-7"></div>
        <div class="col-3">
            <div id="backuptaakFout" class="bg-danger-subtle text-white p-2 rounded" hidden>Geen backuptaak gevonden!</div>
        </div>
        <div class="col-2">
            <button class="btn btn-sm btn-secondary" id="statusBevestigen" hidden>rollback taak <span id="taakidRollback"></span> naar vorige toestand</button>
        </div>
    </div>
</div>
</body>
</html>
