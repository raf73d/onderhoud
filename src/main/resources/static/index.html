<!DOCTYPE html>
<html lang="nl">
<head>
    <title>Onderhoudstaken</title>
    <script src="js/index.js" type="module"></script>
    <link rel="icon" href="images/hamer.ico">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
<div class="container-lg bg-light">
    <div class="row">
        <div class="col-6">
            <h1>Werknemer</h1>
        </div>
        <div class="col-4"></div>
        <div class="col-2">
            login: <span id="userName"></span>
        </div>
    </div>
        <div class="row">
            <div class="col">
                <ul class="nav">
                    <li class="nav-item bg-dark-subtle me-1">
                        <a class="nav-link"  id="checklink"  href="check.html" data-bs-toggle="tooltip"
                           title="ing login"
                        >Check</a>
                    </li>
                    <li class="nav-item bg-body-secondary me-1">
                        <a class="nav-link" href="login" hidden id="loginknop">Login</a>
                    </li>
                </ul>
            </div>

    </div>
    <div class="row mt-3">
        <div class="col-3">
            <label>familienaam:
                <input id="naam" autocomplete="off" pattern="[A-Za-zÀ-ÖØ-öø-ÿ]+([ \-][A-Za-zÀ-ÖØ-öø-ÿ]+)*"
                       autofocus required>
            </label>
        </div>
        <div class="col-2">
            <button class="btn-outline-dark rounded-2" id="zoek"  data-bs-toggle="tooltip"
                    title="tech login">zoek werknemer </button>
        </div>
        <div class="col-4">
            <span id="naamFout" class="bg-danger-subtle text-white p-2 rounded" hidden>naam nok</span>
            <div id="storing" class="bg-danger-subtle text-white p-2 rounded" hidden>Storing, contacteer helpdesk.</div>
            <div id="conflict" class="fout" hidden>conflict</div>
            <div id="badRequest" class="fout" hidden>badrequest</div>
            <div id="mededeling" class="bg-danger-subtle text-white p-2 rounded" hidden>Geen werknemers gevonden!</div>
            <div id="loginNok" class="bg-danger-subtle text-white-50 p-2 rounded" hidden>toegang geweigerd, enkel voor techs</div>
        </div>
    </div>
    <div class="row">
        <div class="col-6">
    <table class="table table-striped">
        <thead id="hoofd1" hidden>
        <tr>
            <th>familienaam</th>
            <th>voornaam</th>
            <th>locatie</th>
        </tr>
        </thead>
        <tbody id="werknemersBody"></tbody>
    </table>
        </div>
</div>
</div>
</body>
</html>
